name: Daily Trend Refresh
on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC ≈ 09:00 台北/香港時間
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run refresh script
        run: python3 refresh_trends.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html xinru_trends_data.json
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "chore: daily trend refresh $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Stage site
        run: mkdir -p _site && cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
